    <title>StrikeOn Pest Control | Regina, SK Exterminators</title>
    <meta name="description" content="Top-rated pest control in Regina, Saskatchewan. Fast, effective, and eco-friendly removal of bed bugs, rodents, ants, and more. Get a free quote today." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: '#022c43', // Deep Navy from Logo
                lime: '#65a30d', // Strong Green from Logo
                darkLime: '#3f6212', // Darker Green for hover
                gold: '#facc15', // Yellow/Gold from Lightning Bolt
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              montserrat: ['Montserrat', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
      /* Custom scrollbar for branch finder */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .pattern-dots {
        background-image: radial-gradient(#ffffff 1px, transparent 1px);
        background-size: 20px 20px;
      }
    </style>
