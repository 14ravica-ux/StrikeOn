<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Navy right half of shield -->
  <path d="M50 5 L85 18 L85 52 C85 72 50 95 50 95 L50 5Z" fill="#0d2240"/>
  <!-- Forest green left half of shield -->
  <path d="M50 5 L15 18 L15 52 C15 72 50 95 50 95 L50 5Z" fill="#1e6b1e"/>
  <!-- Shield outline for crisp edge -->
  <path d="M50 5 L85 18 L85 52 C85 72 50 95 50 95 C50 95 15 72 15 52 L15 18 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
  <!-- Lightning bolt: gold, sharp and centred -->
  <polygon points="58,8  40,52  52,52  42,92  72,44  58,44" fill="#f5c800"/>
  <!-- Thin dark outline on bolt for contrast -->
  <polygon points="58,8  40,52  52,52  42,92  72,44  58,44"
           fill="none" stroke="#c8980a" stroke-width="1" stroke-linejoin="round"/>
</svg>
